[workspace]
resolver = "2"
members = ["catalog-core", "catalog-store", "catalog-api"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
lance = "8.0.0"
arrow-array = "58.0.0"
arrow-schema = "58.0.0"
futures = "0.3"
tempfile = "3"
object_store = { version = "0.13.2", features = ["aws"] }
async-trait = "0.1"
kube = { version = "4.0.0", features = ["client", "runtime", "rustls-tls"], default-features = false }
k8s-openapi = { version = "0.28.0", features = ["v1_34"] }
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
tokio-metrics = { version = "0.5", features = ["rt"] }
metrics-process = "2"
