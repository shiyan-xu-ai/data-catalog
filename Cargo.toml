[workspace]
resolver = "2"
members = ["catalog-store", "catalog-api"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
lance = { version = "14.0.2", default-features = false, features = ["aws"] }
lance-namespace = "14.0.2"
lance-index = "14.0.2"
futures = "0.3"
arrow-array = "58.0.0"
arrow-schema = "58.0.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "json"] }
tempfile = "3"
tracing = "0.1"
tracing-subscriber = "0.3"
