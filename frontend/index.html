<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Set the initial theme before first paint (no flash). Honors the saved
      // choice (light/dark) or falls back to the OS preference in "system" mode.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark = stored === "dark" ||
            ((stored === "system" || !stored) &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" href="/logo-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/logo-dark.png" media="(prefers-color-scheme: dark)" />
    <title>Applied Data Catalog</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
