<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Follow the OS light/dark preference; toggles the `.dark` class shadcn/Tailwind key off.
      // Runs before first paint to avoid a theme flash.
      (function () {
        var mq = window.matchMedia("(prefers-color-scheme: dark)");
        var apply = function (dark) { document.documentElement.classList.toggle("dark", dark); };
        apply(mq.matches);
        mq.addEventListener("change", function (e) { apply(e.matches); });
      })();
    </script>
    <link rel="icon" type="image/png" href="/logo-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/logo-dark.png" media="(prefers-color-scheme: dark)" />
    <title>Applied Data Catalog</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
