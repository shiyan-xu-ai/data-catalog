name: commit-lint

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  conventional-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Squash-merge (this repo's convention) uses the PR title as the final commit
      # message, so only the title needs to conform — individual commits on the branch
      # are free-form and get squashed away.
      - name: Validate PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-zA-Z0-9_./-]+\))?!?: .{1,100}$'
          echo "PR title: $TITLE"
          if ! echo "$TITLE" | grep -qE "$pattern"; then
            echo "::error::PR title does not follow Conventional Commits format."
            echo "Expected: <type>(<scope>)?: <description>"
            echo "Types: build chore ci docs feat fix perf refactor revert style test"
            echo "Example: fix(api): return 404 for unknown table id"
            exit 1
          fi
