name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  # Path-scope the expensive jobs below: a docs-only PR shouldn't pay for the
  # multi-minute Rust build or the frontend build. Job-level `if:` (not a
  # workflow-level `paths`/`paths-ignore` trigger) so the jobs still run and
  # report a (skipped) conclusion instead of never appearing as a check.
  changes:
    runs-on: ubuntu-latest
    # dorny/paths-filter lists the PR's changed files via the GitHub API, which needs
    # pull-requests: read on GITHUB_TOKEN — this repo's default token permissions don't
    # grant it. Setting any `permissions` key replaces the (otherwise implicit)
    # defaults, so contents: read is listed too, for actions/checkout below.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'catalog-core/**'
              - 'catalog-store/**'
              - 'catalog-api/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'Dockerfile'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  build-test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # CI-only build-footprint controls. The lance + datafusion + arrow +
    # aws-sdk dependency graph is huge; building the whole workspace in the dev
    # profile with full debuginfo produces multi-GB object files, and the
    # linker (ld) faults with SIGBUS when the runner exhausts disk/memory
    # mmapping its output. Stripping debuginfo shrinks object files and the
    # linked binaries dramatically. These are env-scoped to the CI job only —
    # they do NOT touch the committed Cargo.toml [profile.*] or the real
    # (Dockerfile release) build.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      # Link with lld instead of the default bfd ld. Linking the large
      # lance + datafusion + arrow binaries is the slowest part of the build
      # (and the earlier SIGBUS-on-link culprit); lld is dramatically faster
      # and more memory-frugal. Scoped to CI via RUSTFLAGS so local dev builds
      # are unaffected and contributors don't need lld installed. lld must be
      # installed before any cargo step below.
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest ships many GB of preinstalled toolchains (Android SDK,
      # .NET, GHC, CodeQL) we never use. Reclaim them before the build so the
      # linker has headroom — SIGBUS-on-link is commonly disk-mmap exhaustion.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Show available disk space
        run: df -h

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Formatting is a cheap, toolchain-only check — run it before the expensive build so a
      # style-only failure fails fast without compiling the lance/datafusion graph.
      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          save-if: true
          shared-key: "workspace"

      # lance-encoding (transitive dep via lance) compiles .proto files in a
      # build script and requires the protoc binary at build time. The dev box
      # has it; ubuntu-latest does not.
      - name: Install protoc
        uses: arduino/setup-protoc@v3

      # lld linker for the RUSTFLAGS=-fuse-ld=lld above. Must precede cargo.
      - name: Install lld
        run: sudo apt-get update && sudo apt-get install -y lld

      # Lint gate. `--all-targets` covers lib, bin, and every test target; `-D warnings` makes
      # any clippy warning fail CI. This compiles the workspace under the clippy driver; the
      # `cargo test` step below reuses the warmed dependency cache.
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      # `cargo test --all-targets` compiles every target (lib, the catalog-api
      # bin, and all test binaries) AND runs the tests in one invocation. There
      # are no doctests in this workspace, so --all-targets skips nothing.
      - name: cargo test --workspace
        run: cargo test --workspace --all-targets

  # The static frontend hand-mirrors the serde-serialized API shapes; typechecking + building it
  # in CI catches drift against those shapes. Lightweight and independent of the Rust build, so
  # it runs as its own job.
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck and build
        run: bun run build
