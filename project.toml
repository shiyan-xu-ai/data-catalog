name = "lance-catalog"

# AWS credentials for S3 come from Secret Manager (there is no ambient AWS
# credential on Cloud Run). Set them with:
#   apps-platform app secret set AWS_ACCESS_KEY_ID <id>
#   apps-platform app secret set AWS_SECRET_ACCESS_KEY <key>
enable_secrets = true

# Postgres is the catalog metastore. The platform sets INSTANCE_CONNECTION_NAME, DB_USER, and
# DB_NAME; docker-entrypoint.sh runs the Cloud SQL Auth Proxy and derives DATABASE_URL.
enable_mysql = false
enable_postgres = true
enable_gcs_fuse = false

[cloudrun]
port = 8080
cpu = "1"
memory = "1Gi"
# Enable only if the S3 bucket policy allowlists a fixed source IP; the static
# egress IPs per environment are in the platform docs.
use_static_egress_ip = false

[cloudrun.env_vars]
# Non-secret runtime config. Region applies to S3 URIs the catalog opens.
AWS_DEFAULT_REGION = "us-east-1"
RUST_LOG = "info"

[metadata]
owner = "shiyan.xu@applied.co"
description = "Postgres-backed Lance REST catalog"
