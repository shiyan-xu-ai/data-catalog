---
# Staging overlay config: real S3 via IRSA, moderate resources.
#
# Assumptions:
# - The EKS cluster has IRSA configured; the catalog-api ServiceAccount annotation
#   (serviceaccount.yaml in this overlay) carries the staging IAM role ARN.
# - The staging S3 bucket is named "catalog-staging-data" with the registry and
#   sweep root prefixes below. Adjust to match your staging account.
# - AWS region is us-east-1; override if your staging cluster is elsewhere.
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-api-config
  namespace: default
data:
  CATALOG_LEADER_MODE: "kube"
  CATALOG_LEASE_NAMESPACE: "default"
  CATALOG_LEASE_NAME: "catalog-api-leader"

  CATALOG_REGISTRY_PATH: "s3://catalog-staging-data/_catalog/registry"
  CATALOG_TTL_AUDIT_PATH: "s3://catalog-staging-data/_catalog/ttl_audit"
  CATALOG_SWEEP_ROOT_URI: "s3://onroad-perception-datasets-staging/scenario_dataset_export"

  # 10-minute sweep cycle for staging (faster feedback than prod 30 min).
  CATALOG_SWEEP_INTERVAL_SECS: "600"
  CATALOG_REGISTRY_REFRESH_INTERVAL_SECS: "5"

  RUST_LOG: "info"
