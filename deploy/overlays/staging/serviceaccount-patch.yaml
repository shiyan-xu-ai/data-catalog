---
# Staging ServiceAccount: add the IRSA role ARN annotation.
# Replace ACCOUNT_ID and the role name with the real staging values.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog-api
  namespace: default
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::STAGING_ACCOUNT_ID:role/catalog-api-s3-role-staging"
