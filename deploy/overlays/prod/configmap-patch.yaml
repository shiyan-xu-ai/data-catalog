---
# Prod overlay config: real S3 via IRSA, standard sweep cadence.
#
# Assumptions:
# - IRSA is configured; the prod ServiceAccount annotation carries the prod role ARN.
# - Prod S3 bucket: "onroad-perception-datasets" (sweep root) and
#   "catalog-prod-data" (registry + audit). Adjust to your prod account.
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-api-config
  namespace: default
data:
  CATALOG_LEADER_MODE: "kube"
  CATALOG_LEASE_NAMESPACE: "default"
  CATALOG_LEASE_NAME: "catalog-api-leader"

  CATALOG_REGISTRY_PATH: "s3://catalog-prod-data/_catalog/registry"
  CATALOG_TTL_AUDIT_PATH: "s3://catalog-prod-data/_catalog/ttl_audit"
  CATALOG_SWEEP_ROOT_URI: "s3://onroad-perception-datasets/scenario_dataset_export"

  # 30-minute sweep cycle (default; matches ~1800 s in config.rs).
  CATALOG_SWEEP_INTERVAL_SECS: "1800"
  CATALOG_REGISTRY_REFRESH_INTERVAL_SECS: "5"

  RUST_LOG: "info"
