---
# PodDisruptionBudget: ensure at least 2 replicas are always available during
# voluntary disruptions (node drains, rolling updates). This keeps one leader
# and one warm standby alive through a rolling deploy or node maintenance.
#
# maxUnavailable=1 paired with maxSurge=1 in the Deployment rolling strategy
# means: add 1 new pod, confirm ready, then evict 1 old pod. No availability gap.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: catalog-api
  namespace: default
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: catalog-api
