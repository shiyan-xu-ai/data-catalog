---
# Prod ServiceAccount: IRSA role ARN for S3 access.
# Replace PROD_ACCOUNT_ID with the real AWS account ID.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog-api
  namespace: default
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::PROD_ACCOUNT_ID:role/catalog-api-s3-role-prod"
