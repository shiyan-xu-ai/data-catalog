---
# Patch: 1 replica for local dev; lower resource requests; inject MinIO credentials.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: default
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: catalog-api
          envFrom:
            - configMapRef:
                name: catalog-api-config
            # MinIO credentials (local only; prod/staging use IRSA).
            - secretRef:
                name: catalog-api-s3-creds
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
