---
# Default configuration for catalog-api. Overlays patch these values as needed.
# All env vars correspond directly to fields parsed in catalog-api/src/config.rs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-api-config
  namespace: default
data:
  # ── Leader election ──────────────────────────────────────────────────────────
  # "kube" uses the real coordination.k8s.io/v1 Lease API (requires the RBAC above).
  # "forced-on"  — always leader; single-replica dev/test only, no election.
  # "forced-off" — always follower; useful for read-only replicas in tests.
  CATALOG_LEADER_MODE: "kube"

  # Namespace where the leader-election Lease lives. Must match the Role namespace.
  CATALOG_LEASE_NAMESPACE: "default"

  # Name of the Lease object. All replicas of catalog-api must use the same name.
  CATALOG_LEASE_NAME: "catalog-api-leader"

  # How often the leader-election loop ticks (acquire or renew attempt), in seconds.
  CATALOG_LEADER_TICK_INTERVAL_SECS: "10"

  # TTL advertised to the k8s API server for the Lease, in seconds.
  # If the holder misses a renewal, a new replica can acquire after this window.
  CATALOG_LEASE_DURATION_SECS: "30"

  # ── API server ───────────────────────────────────────────────────────────────
  # Main REST API bind address. Exposed as port 8080 in the Service.
  CATALOG_BIND_ADDR: "0.0.0.0:8080"

  # Internal metrics + healthz server (scraped by Prometheus via the named port "metrics").
  # Not exposed through the load balancer — Service targets it as a named port only.
  CATALOG_METRICS_BIND_ADDR: "0.0.0.0:9090"

  # ── Storage paths ────────────────────────────────────────────────────────────
  # URI of the Lance dataset that stores the registry (_catalog/registry).
  # In prod/staging this is an s3:// URI; in local it points at the in-cluster MinIO.
  # Overlays must patch this value to the environment-specific URI.
  CATALOG_REGISTRY_PATH: "s3://CHANGE_ME_BUCKET/_catalog/registry"

  # URI of the Lance dataset that stores TTL apply audit records.
  CATALOG_TTL_AUDIT_PATH: "s3://CHANGE_ME_BUCKET/_catalog/ttl_audit"

  # ── Sweep ────────────────────────────────────────────────────────────────────
  # Root URI the sweep loop lists. All timestamp-versioned lance tables live under here.
  # Overlays must patch this value.
  CATALOG_SWEEP_ROOT_URI: "s3://onroad-perception-datasets/scenario_dataset_export"

  # How often the leader runs a full sweep, in seconds (default 1800 = 30 min).
  CATALOG_SWEEP_INTERVAL_SECS: "1800"

  # How often all pods (leader + followers) refresh their in-memory registry cache, in seconds.
  CATALOG_REGISTRY_REFRESH_INTERVAL_SECS: "5"

  # ── Logging ──────────────────────────────────────────────────────────────────
  # tracing-subscriber env filter. Overlays may set "debug" for local dev.
  RUST_LOG: "info"
