---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: default
  labels:
    app: catalog-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # One extra pod during rollout; keeps the leader alive through a deploy.
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: catalog-api
    spec:
      serviceAccountName: catalog-api

      # Zone anti-affinity: spread replicas across availability zones so a zone
      # outage does not take out both the leader and the standby.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: catalog-api

      containers:
        - name: catalog-api
          image: catalog-api:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: api
              containerPort: 8080
              protocol: TCP
            # Named port "metrics" — must match the ServiceMonitor endpoint name
            # (deploy/base/monitoring/servicemonitor.yaml: port: metrics).
            - name: metrics
              containerPort: 9090
              protocol: TCP

          envFrom:
            - configMapRef:
                name: catalog-api-config

          env:
            # Inject the pod name so the Lease holder identity is pod-unique.
            # KubeLeaseElector uses CATALOG_POD_NAME as the holder identity.
            - name: CATALOG_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 2

          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            # Allow up to 60 s for the first registry hydration before liveness kicks in.
            failureThreshold: 12
            periodSeconds: 5

          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"

      # Give the leader pod time to complete in-flight sweep writes before termination.
      terminationGracePeriodSeconds: 30
