---
# Grafana dashboard provisioning: tells Grafana to load dashboards from ConfigMaps mounted
# under /var/lib/grafana/dashboards. All ConfigMaps labelled grafana_dashboard=1 in the
# monitoring namespace are mounted there by the Grafana deployment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provisioning
  namespace: monitoring
  labels:
    app: grafana
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: catalog
        orgId: 1
        folder: "Catalog"
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
