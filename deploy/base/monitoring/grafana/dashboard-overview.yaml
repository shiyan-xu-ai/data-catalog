---
# Grafana dashboard: catalog-api Overview.
# Panels: request rate, error rate, p99 latency, pod count, hydration readiness, leader gauge.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-overview
  namespace: monitoring
  labels:
    app: grafana
    grafana_dashboard: "1"
data:
  overview.json: |
    {
      "title": "Catalog API — Overview",
      "uid": "catalog-overview",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Request Rate (req/s)",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [
            {
              "expr": "sum(rate(catalog_http_requests_total[2m])) by (class)",
              "legendFormat": "{{class}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Error Rate (%)",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [
            {
              "expr": "100 * sum(rate(catalog_http_requests_total{status=~\"5..\"}[2m])) / sum(rate(catalog_http_requests_total[2m]))",
              "legendFormat": "5xx %"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Latency p99 (s)",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum(rate(catalog_http_request_duration_seconds_bucket[2m])) by (le, class))",
              "legendFormat": "p99 {{class}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Leader",
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 8},
          "targets": [
            {
              "expr": "sum(catalog_is_leader)",
              "legendFormat": "leader pods"
            }
          ],
          "options": {
            "thresholds": {
              "steps": [
                {"color": "red", "value": 0},
                {"color": "green", "value": 1}
              ]
            }
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Hydration Ready",
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 8},
          "targets": [
            {
              "expr": "min(catalog_hydration_ready)",
              "legendFormat": "ready"
            }
          ],
          "options": {
            "thresholds": {
              "steps": [
                {"color": "red", "value": 0},
                {"color": "green", "value": 1}
              ]
            }
          }
        }
      ]
    }
