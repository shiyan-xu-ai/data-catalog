---
# Role granting catalog-api pods the ability to manage the leader-election Lease.
# KubeLeaseElector uses coordination.k8s.io/v1 Leases for leader election;
# it requires: get (read current holder), create (first-time init), update (acquire/renew).
# patch is included for field-manager SSA compatibility even though the current
# implementation uses replace (Api::replace); future kube-rs versions may use SSA.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: catalog-api-leader-election
  namespace: default
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: catalog-api-leader-election
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: catalog-api-leader-election
subjects:
  - kind: ServiceAccount
    name: catalog-api
    namespace: default
