---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog-api
  namespace: default
  annotations:
    # IRSA (IAM Roles for Service Accounts) — populate with the real ARN for staging/prod.
    # The local overlay omits this annotation; MinIO credentials use a Secret instead.
    # eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/catalog-api-s3-role
    #
    # The IAM role should grant:
    #   s3:GetObject, s3:ListBucket, s3:PutObject, s3:DeleteObject
    #   on the sweep root bucket (read + delete for TTL apply)
    #   s3:GetObject, s3:PutObject, s3:DeleteObject
    #   on the _catalog/ prefix within the registry bucket.
    #
    # No IAM permissions are needed for the k8s Lease — that is handled by the
    # Role/RoleBinding below (Kubernetes RBAC, not AWS IAM).
