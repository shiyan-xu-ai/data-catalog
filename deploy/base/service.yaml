---
apiVersion: v1
kind: Service
metadata:
  name: catalog-api
  namespace: default
  labels:
    app: catalog-api
spec:
  selector:
    app: catalog-api
  ports:
    # Main REST API — exposed to clients (ClusterIP in base; overlays may add LoadBalancer
    # or Ingress for external access).
    - name: api
      port: 8080
      targetPort: api
      protocol: TCP
    # Internal metrics + healthz port — named "metrics" to match the ServiceMonitor selector
    # (deploy/base/monitoring/servicemonitor.yaml: endpoints[0].port: metrics).
    # Not exposed beyond ClusterIP; Prometheus scrapes it inside the cluster.
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
  type: ClusterIP
